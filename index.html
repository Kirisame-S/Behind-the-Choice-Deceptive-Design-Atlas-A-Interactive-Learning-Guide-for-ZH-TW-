function startQuiz(){quizIndex=0;quizAnswers=[];renderQuestion()}
function renderQuestion(){answered=false;const q=questions[quizIndex];main.innerHTML=`<div class="wrap"><section class="quiz-page"><a class="back" href="#catalog">← 返回設計圖鑑</a><div class="eyebrow">THE RECOGNITION CHALLENGE</div><h1>看穿介面的小心機。</h1><p class="intro">依情境辨認最主要的手法。每題作答後都有解說，不限時間。</p><div class="progress-label"><span>第 ${quizIndex+1} 題，共 8 題</span><span>已答對 ${quizAnswers.filter(x=>x.correct).length} 題</span></div><div class="progress-line"><span style="width:${quizIndex/8*100}%"></span></div><div class="question-box"><p class="eyebrow">SCENARIO ${num(quizIndex)}</p><h2>${q.q}</h2><div class="answers">${q.options.map((n,i)=>`<button class="answer" data-choice="${n}"><span class="eyebrow">${String.fromCharCode(65+i)}</span>　${patterns[n].name}</button>`).join('')}</div><div id="quizFeedback" class="quiz-feedback" role="status" hidden></div><div class="quiz-actions"><button id="nextQuestion" class="primary" hidden>${quizIndex===7?'查看結果':'下一題 →'}</button></div></div></section></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answerQuestion(Number(b.dataset.choice)));document.getElementById('nextQuestion').onclick=()=>{quizIndex++;if(quizIndex===8)renderResults();else renderQuestion();window.scrollTo(0,0)}}
function answerQuestion(choice){if(answered)return;answered=true;const q=questions[quizIndex],correct=choice===q.p;quizAnswers.push({choice,correct});document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;if(Number(b.dataset.choice)===q.p)b.classList.add('correct');else if(Number(b.dataset.choice)===choice)b.classList.add('wrong')});const el=document.getElementById('quizFeedback');el.hidden=false;el.textContent=`${correct?'✓ 答對了。':'再觀察一下。正確答案是「'+patterns[q.p].name+'」。'} ${patterns[q.p].definition}`;const next=document.getElementById('nextQuestion');next.hidden=false;next.focus()}
function renderResults(){const score=quizAnswers.filter(x=>x.correct).length;state.best=Math.max(state.best||0,score);save();main.innerHTML=`<div class="wrap"><section class="quiz-page"><div class="eyebrow">CHALLENGE COMPLETE</div><h1>${score>=6?'你開始看見設計的背面了。':'每一次觀察，都是練習。'}</h1><div class="score">${score}<span style="font-size:25px;color:var(--muted)"> / 8</span></div><p class="intro">${score===8?'全部答對！把這份觀察帶進下一次購物、訂閱或隱私設定。':'回顧下面的情境，點進案例就能再試一次。'} 本機最佳：${state.best} / 8。</p><div>${questions.map((q,i)=>`<div class="review-item">${quizAnswers[i].correct?'✓':'○'} ${num(i)}　<a href="#pattern/${patterns[q.p].id}">${patterns[q.p].name} ↗</a>${quizAnswers[i].correct?'':'　你的答案：'+patterns[quizAnswers[i].choice].name}<p style="color:var(--muted);margin-top:5px">${patterns[q.p].definition}</p></div>`).join('')}</div><div class="quiz-actions"><button id="retryQuiz" class="primary">再挑戰一次 ↻</button><a class="secondary" href="#catalog">回到圖鑑</a></div></section></div>`;document.getElementById('retryQuiz').onclick=()=>{startQuiz();window.scrollTo(0,0)}}
const specText=`作品名稱：選擇的背面 — Deceptive Design Atlas

一、發想與目標
以互動圖鑑幫助一般網路使用者辨認誘導式設計。我喜歡 Laws of UX 把抽象概念轉成幾何圖像的方式，因此希望用類似的視覺語言，結合 Deceptive Design 的分類資料，製作可以親自操作的繁體中文學習工具。

二、目標使用者
對網路購物、訂閱及隱私選擇有興趣的學生、一般使用者，以及初學 UI／UX 設計者。

三、內容與資料來源
選取 8 種手法：預設勾選、隱藏費用、難以取消、假性急迫、視覺干擾、羞辱式拒絕、偽裝廣告、誤導文案。
概念來源：Brignull, H., & Leiser, M. (2026). Deceptive patterns. https://deceptive.design/ 。查閱日期：2026/10/19。每個案例頁附對應分類來源。
視覺參考：https://lawsofux.com/ 。採用幾何插圖、卡片網格與清楚排版的設計方向；圖形、配色組合、中文文案、模擬案例與程式另行製作，沒有複製其網站素材。
互動中的商店、費用、商品與操作結果皆為原創虛構情境，不作為任何真實公司的事實指控。

四、功能規格與驗收條件
1. 圖鑑首頁：呈現 8 張卡片，含編號、原創幾何圖、中文名稱、英文名稱及摘要；點選進入對應獨立案例畫面。
2. 搜尋與分類：以中文或英文名稱搜尋，可選全部、選擇操控、金錢陷阱、流程阻礙、心理施壓；搜尋與分類同時生效，找不到資料時顯示提示。
3. 獨立案例頁：使用網址 hash 導覽，提供定義、互動實驗、原理、防範建議、個別來源及前後案例導覽；重新整理仍能開啟該案例。
4. 8 個互動實驗：取消預設加購後總價由 300 降為 240；結帳揭露 80 元費用，總價 280；取消訂閱需 4 次操作；10 秒假倒數會重設；Cookie 同意／拒絕有不同結果；電子報接受／拒絕有不同結果；廣告與真正下載入口有不同回饋；郵件勾選狀態會改變設定結果。
5. 友善設計切換：所有案例可在誘導版本與友善版本間切換；友善版本採主動加購、先揭露總價、一次取消、移除假期限、清楚拒絕、中性文字、標示廣告與肯定句設定；切換或重試時重設實驗。
6. 辨識挑戰：8 題單選情境題，每種手法一題；作答後顯示正解與解釋，每題只計分一次；完成後提供總分、最佳成績、逐題回顧及重新挑戰。
7. 學習紀錄：操作案例或切換版本後標記已體驗；使用 localStorage 記錄進度與最佳成績。無法儲存時網站仍可操作並提示；可手動清除紀錄。
8. 響應式與基本無障礙：桌面四欄、手機兩欄；內頁於窄螢幕改成單欄。使用語意化按鈕、可見焦點、鍵盤操作、狀態提示及減少動態效果設定。

五、技術與範圍
全部內容、CSS、JavaScript 與 SVG 都內嵌在單一 index.html。無須安裝、建置、後端、API 金鑰、外部字型或圖片；可直接以瀏覽器開啟。參考來源連結與 GitHub Pages 網址需要網路。所有購買、訂閱、Cookie、廣告與下載都只是教學模擬。

六、AI 協作與修改紀錄
1. 初期 AI 提出心情選片機，經討論後放棄；改找誘導式設計網站作為內容方向。
2. 透過多次搜尋確認視覺參考是 Laws of UX；決定以 Deceptive Design 作為概念來源，另做中文圖鑑。
3. AI 協助整理功能規格、設計幾何插圖並實作單檔網頁；加入可操作案例、友善版本對照與測驗，讓作品可實際使用。
4. 使用瀏覽器實測 8 個實驗、友善切換、搜尋分類與完整測驗，確認手機無水平溢出；檢視截圖後調整手機標題字級，改善換行，並修正主內容聚焦時的外框。

七、公開與繳交
將 index.html 放在 GitHub 公開儲存庫根目錄，於 Settings → Pages 選 Deploy from a branch、main、/(root)，儲存後等待發布。
文字輸入繳交需含實際 GitHub Pages 網址、網站介面截圖與本規格說明。網站發布完成後才填入正式網址。
繳交標題：學校 學號 系級 姓名 選擇的背面
`;
function renderSpec(){main.innerHTML=`<div class="wrap"><section class="spec"><a class="back" href="#catalog">← 返回設計圖鑑</a><p class="eyebrow">PROJECT SPECIFICATION</p><h1>作業規格與製作說明</h1><p>選擇的背面 — Deceptive Design Atlas</p><div class="quiz-actions"><button class="primary" id="copySpec">複製完整規格</button><button class="secondary" id="downloadSpec">下載規格文字</button></div><div id="specBody"></div><h2>規格與實作對應</h2><table><thead><tr><th>要求</th><th>對應實作</th></tr></thead><tbody><tr><td>清楚具體的規格</td><td>本頁定義對象、內容、功能及驗收條件</td></tr><tr><td>可操作的互動</td><td>8 個實驗、雙版本比較、搜尋篩選、8 題測驗</td></tr><tr><td>單一 index.html</td><td>HTML、CSS、JavaScript、SVG 全部內嵌</td></tr><tr><td>AI 反覆討論與修改</td><td>主題調整、參考確認、規格整理與實測修正</td></tr><tr><td>GitHub Pages 公開</td><td>由作者將本檔上傳公開儲存庫並啟用 Pages</td></tr></tbody></table></section></div>`;const body=document.getElementById('specBody');specText.split('\n\n').forEach((section,i)=>{if(i===0)return;const lines=section.split('\n'),h=document.createElement('h2');h.textContent=lines.shift();body.appendChild(h);lines.forEach(line=>{const p=document.createElement('p');p.textContent=line;body.appendChild(p)})});document.getElementById('copySpec').onclick=async()=>{try{await navigator.clipboard.writeText(specText);toast('完整規格已複製，可以貼到作業文字區。')}catch(e){toast('瀏覽器不支援直接複製，請使用「下載規格文字」。')}};document.getElementById('downloadSpec').onclick=()=>{const url=URL.createObjectURL(new Blob(['\uFEFF'+specText],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='選擇的背面_規格書.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
